<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Időpontfoglaló</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="container">
    <h1>Időpontfoglaló rendszer</h1>
    <p class="muted">Vizsgaremek demo – web kliens</p>
  </header>

  <main class="container grid">
    <section class="card">
      <h2>Bejelentkezés</h2>
      <form id="loginForm">
        <label>E-mail
          <input type="email" id="loginEmail" required placeholder="user@demo.local" />
        </label>
        <label>Jelszó
          <input type="password" id="loginPassword" required placeholder="User123!" />
        </label>
        <button type="submit">Belépés</button>
        <button id="logoutBtn" type="button">Kijelentkezés</button>
        <button id="openAdminBtn" type="button" class="hidden">Admin felület</button>
      </form>

      <hr />

      <h2>Regisztráció</h2>
      <form id="registerForm">
        <label>E-mail
          <input type="email" id="regEmail" required />
        </label>
        <label>Jelszó
          <input type="password" id="regPassword" required />
        </label>
        <label>Keresztnév
          <input type="text" id="regFirstName" />
        </label>
        <label>Vezetéknév
          <input type="text" id="regLastName" />
        </label>
        <button type="submit">Regisztráció</button>
      </form>

      <div class="status" id="authStatus"></div>
    </section>

    <section class="card">
      <h2>Foglalás</h2>

      <div class="row">
        <div class="col">
          <label>Szolgáltatás
            <select id="serviceSelect"></select>
          </label>
        </div>
        <div class="col">
          <label>Dolgozó
            <select id="employeeSelect"></select>
          </label>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Dátum
            <input type="date" id="dateInput" />
          </label>
        </div>
        <div class="col">
          <button id="loadSlotsBtn" type="button">Szabad időpontok</button>
        </div>
      </div>

      <div id="slots" class="slots"></div>

      <div class="status" id="bookingStatus"></div>
    </section>

    <section class="card">
      <h2>Saját foglalások</h2>
      <button id="loadMyAppointmentsBtn" type="button">Frissítés</button>
      <div id="myAppointments"></div>
    </section>
  </main>

  <div id="adminModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" id="adminModalCloseBackdrop"></div>
    <div class="modal-dialog card" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
      <div class="modal-header">
        <h2 id="adminModalTitle">Admin felület</h2>
        <button id="adminModalCloseBtn" type="button" class="modal-close" aria-label="Bezárás">×</button>
      </div>
      <p class="muted">Csak ADMIN jogosultsággal érhető el.</p>

      <div class="row">
        <div class="col">
          <label>Tól
            <input id="adminDateFrom" type="date" />
          </label>
        </div>
        <div class="col">
          <label>Ig
            <input id="adminDateTo" type="date" />
          </label>
        </div>
      </div>

      <div class="row">
        <button id="loadAdminAppointmentsBtn" type="button">Foglalások lekérése</button>
      </div>

      <div id="adminAppointments"></div>
      <hr />

      <h3>Dolgozók kezelése</h3>
      <form id="employeeForm">
        <input id="employeeId" type="hidden" />

        <div class="row">
          <div class="col">
            <label>Név
              <input id="employeeName" type="text" required />
            </label>
          </div>
          <div class="col">
            <label>E-mail
              <input id="employeeEmail" type="email" placeholder="(opcionális)" />
            </label>
          </div>
          <div class="col">
            <label>Telefonszám
              <input id="employeePhone" type="text" placeholder="(opcionális)" />
            </label>
          </div>
        </div>

        <div class="row">
          <label>
            <input id="employeeIsActive" type="checkbox" checked /> Aktív
          </label>
        </div>

        <div class="row">
          <button id="employeeSaveBtn" type="submit">Dolgozó mentése</button>
          <button id="employeeResetBtn" type="button">Űrlap törlése</button>
        </div>
      </form>

      <div id="adminEmployees"></div>
      <div class="status" id="adminStatus"></div>
    </div>
  </div>

  <footer class="container muted">
    <small>Backend base URL: <span id="baseUrlLabel"></span></small>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
